name: widgetbook_workspace
description: "Widgetbook catalog for flutter_lab."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_lab:
    path: ../
  widgetbook: ^3.23.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  widgetbook_generator: ^3.24.0
  # Pinned to the version used by the root package; 2.15 fails to compile
  # its build script when dependencies use native build hooks.
  build_runner: 2.11.1

flutter:
  uses-material-design: true
